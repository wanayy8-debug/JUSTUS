name: Build Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Node.js (Node.js 20 သို့မဟုတ် 22/24 ကို သုံးရန်)
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # 3. Setup Java (v4 မှ v5 သို့ ပြောင်းရန်)
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
